[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pincheck"
version = "1.0.0"
description = "Detect unpinned Hugging Face model dependencies in Python code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Aditya Vardhan Khetawat" },
  { name = "Rishi Sharma" },
  { name = "Samairaa Arora" },
  { name = "Manish Rai" },
]
keywords = ["mlops", "hugging-face", "static-analysis", "reproducibility", "supply-chain"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
study = ["requests>=2.28", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
pincheck = "pincheck.cli:entry"

[tool.setuptools]
packages = ["pincheck"]
